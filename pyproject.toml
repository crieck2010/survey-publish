[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-publish"
version = "0.1.0"
description = "Deterministic multi-platform publishing engine: upload finished MP4 map reels to YouTube, Instagram, Facebook, and TikTok."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Charles Rieck" }]
keywords = ["publishing", "youtube", "instagram", "facebook", "tiktok", "reels", "surveying"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.28",
]

[project.scripts]
survey-publish = "publish.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/survey-publish"

[tool.setuptools.packages.find]
where = ["src"]
